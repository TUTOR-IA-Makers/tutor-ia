# Only for writing a new revision:
#
#   .venv/bin/alembic revision -m "add questions table"
#
# Apply revisions with `codeexpert migrate`, never `alembic upgrade`: the
# database URL comes from Settings, not from this file. See docs/adr/0013.
[alembic]
script_location = %(here)s/src/codeexpert/store/migrations
file_template = %%(rev)s_%%(slug)s
