name: Deploy

# Ships main to the Hostinger VPS, and only main, and only after the gate passed.
#
# Triggered by the CI workflow finishing rather than by the push itself, so the
# gate is `scripts/check.sh` exactly as CI ran it — not a second copy of it that
# could drift (docs/adr/0008). A red, cancelled or skipped CI run never reaches
# the deploy job. Where it ships to, and how: docs/adr/0011, docs/guides/deploy.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Never cancel a deploy half way. A newer commit waits for the current deploy.
# GitHub keeps a single pending run per group, so with several merges in a row
# the ones in between are dropped; the `current` job below also skips a run whose
# commit is no longer the tip of main by the time it gets its turn.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Runs only once this run has its turn in the concurrency group, so "is my
  # commit still the tip of main" is answered after any wait, not before it.
  # A superseded commit is skipped, not failed: the newer commit deploys on the
  # back of its own CI run.
  current:
    name: commit is the tip of main
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is_tip: ${{ steps.tip.outputs.is_tip }}
    steps:
      - id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" = "$SHA" ]; then
            echo "is_tip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$SHA is no longer the tip of main ($tip); skipping its deploy."
            echo "is_tip=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: build, push, deploy
    needs: current
    if: needs.current.outputs.is_tip == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    permissions:
      contents: read
      # Push the image to GHCR with this run's own token: no registry credential
      # is stored anywhere.
      packages: write
    env:
      # The commit CI checked, not whatever main points at by now.
      SHA: ${{ github.event.workflow_run.head_sha }}
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      HAS_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
    steps:
      - name: Check the deploy configuration
        run: |
          missing=""
          for name in VPS_HOST VPS_HOST_KEY PRODUCTION_URL; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          [ "$HAS_SSH_KEY" = "true" ] || missing="$missing DEPLOY_SSH_KEY(secret)"
          if [ -n "$missing" ]; then
            echo "::error::Not set on the production environment:$missing. See docs/guides/deploy.md."
            exit 1
          fi
          # GHCR rejects upper case, and the organisation name has some.
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/codeexpert:$SHA" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SHA }}

      - name: Build the image
        # The source label links the GHCR package to this repository.
        run: |
          docker build \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$SHA" \
            --tag "$IMAGE" backend

      - name: Push to GitHub Container Registry
        env:
          TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"

      # The key's authorized_keys entry has a forced command
      # (/usr/local/bin/codeexpert-deploy): the SHA is the only thing it accepts,
      # and the only thing this step can make the VPS do.
      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key: a server that cannot prove it is our VPS gets nothing.
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o BatchMode=yes -o ConnectTimeout=20 \
            "deploy@$VPS_HOST" "$SHA"

      - name: Remove the key from the runner
        if: always()
        run: rm -f ~/.ssh/deploy_key

      # deploy.sh already waited for the container to report healthy. This checks
      # it from outside, through the proxy and TLS, as a teacher would reach it.
      - name: Check GET /health reports this commit
        run: |
          body=$(curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "${PRODUCTION_URL%/}/health")
          echo "$body"
          commit=$(printf '%s' "$body" | python3 -c 'import json, sys; print(json.load(sys.stdin)["commit"])')
          if [ "$commit" != "$SHA" ]; then
            echo "::error::$PRODUCTION_URL/health reports commit '$commit', expected '$SHA'."
            exit 1
          fi
