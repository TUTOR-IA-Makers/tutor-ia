name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: gate
    runs-on: ubuntu-latest
    # A throwaway Postgres for this job only, so the store and migration tests
    # run here instead of skipping. They create and drop a database of their own
    # on it (backend/tests/conftest.py); the password never leaves this job.
    # Locally the variable is unset, they skip, and the gate stays offline.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CODEEXPERT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6
        with:
          # check.sh inspects the index for tracked artefacts and secrets.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "backend[dev,docs]"

      # Deliberately the same script developers and agents run. Restating the
      # steps here is how local and CI drift apart. See docs/adr/0008.
      - name: Run the gate
        run: ./scripts/check.sh

      - name: Coverage summary
        if: always()
        working-directory: backend
        run: python -m pytest --cov --cov-report=term-missing -q

  conventions:
    name: conventions
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: PR title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -qE '^(feat|fix|docs|refactor|chore|test|perf|build|ci)(\([a-z0-9 -]+\))?!?: .+'; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat: verify declared constraints'"
            echo "Got: $TITLE"
            exit 1
          fi

      - name: PR links an issue
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! printf '%s' "$BODY" | grep -qiE '(closes|fixes|resolves|refs) #[0-9]+'; then
            echo "::error::The PR body must reference its issue, e.g. 'Closes #42'."
            exit 1
          fi
