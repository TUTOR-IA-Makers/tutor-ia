name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # check.sh inspects the index for tracked artefacts and secrets.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs]"

      # Deliberately the same script developers and agents run. Restating the
      # steps here is how local and CI drift apart. See docs/adr/0008.
      - name: Run the gate
        run: ./scripts/check.sh

      - name: Coverage summary
        if: always()
        run: python -m pytest --cov --cov-report=term-missing -q

  conventions:
    name: conventions
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: PR title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -qE '^(feat|fix|docs|refactor|chore|test|perf|build|ci)(\([a-z0-9 -]+\))?!?: .+'; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat: verify declared constraints'"
            echo "Got: $TITLE"
            exit 1
          fi

      - name: PR links an issue
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! printf '%s' "$BODY" | grep -qiE '(closes|fixes|resolves|refs) #[0-9]+'; then
            echo "::error::The PR body must reference its issue, e.g. 'Closes #42'."
            exit 1
          fi
