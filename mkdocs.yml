site_name: CodeExpert
site_url: https://tutor-ia-makers.github.io/tutor-ia/
site_description: Gerador automatizado de exercícios de programação em C para o Moodle CodeRunner.
site_author: Hugo Rosa
copyright: Copyright &copy; 2026 Hugo Rosa — Licenciado sob MIT

repo_name: TUTOR-IA-Makers/tutor-ia
repo_url: https://github.com/TUTOR-IA-Makers/tutor-ia
edit_uri: ""

docs_dir: docs
site_dir: .dist/site

theme:
  name: material
  language: pt-BR
  favicon: assets/favicon.svg
  logo: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Seguir o tema do sistema
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Mudar para tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Mudar para tema claro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - search.suggest
    - search.highlight
    - search.share

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/TUTOR-IA-Makers/tutor-ia
      name: Repositório no GitHub
  generator: false

plugins:
  - search:
      lang:
        - pt
        - en

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link permanente para esta seção
      title: Nesta página
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Início: index.md
  - Começar:
      - Primeiro dia: onboarding/index.md
      - Da issue ao PR: guides/first-task.md
      - Gerar uma questão: guides/generate-a-question.md
      - Rodar com Docker: guides/docker.md
      - Deploy no Cloud Run: guides/deploy.md
      - Importar no Moodle: guides/import-into-moodle.md
  - Arquitetura:
      - architecture/index.md
      - Pipeline de geração: architecture/pipeline.md
      - Decisões (ADR):
          - adr/index.md
          - 0001 — Record architecture decisions: adr/0001-record-architecture-decisions.md
          - 0002 — Modular monolith, src layout: adr/0002-modular-monolith-src-layout.md
          - 0003 — One workspace per run: adr/0003-one-workspace-per-run.md
          - 0004 — Execution behind a protocol: adr/0004-execution-behind-a-runner-protocol.md
          - 0005 — One instruction file for agents: adr/0005-single-instruction-file-for-agents.md
          - 0006 — Issues plus task file per branch: adr/0006-issues-plus-task-file-per-branch.md
          - 0007 — Configuration from the environment: adr/0007-configuration-from-the-environment.md
          - 0008 — One gate for people, agents and CI: adr/0008-one-gate-for-people-agents-and-ci.md
          - 0009 — One container image with the API and gcc: adr/0009-container-image-with-gcc.md
          - Modelo: adr/0000-template.md
  - Roadmap:
      - Evolução até 30/11: product/roadmap.md
      - Plano de entrega 30/11: product/plano-30-11.md
      - Plataforma-alvo: product/index.md
      - Arquitetura-alvo (SAD): product/target-architecture.md
      - Backlog da plataforma: product/mvp-backlog.md
  - Referência:
      - API: reference/api.md
      - Comandos e configuração: reference/configuration.md
      - Código: reference/codebase.md
      - Harness: reference/harness.md
      - Documentação: reference/docs.md
      - Problemas comuns: reference/troubleshooting.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
