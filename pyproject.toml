[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeexpert"
version = "0.2.0"
description = "Generates C programming exercises and exports them as Moodle CodeRunner XML."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.6.23",
    "pymdown-extensions==10.16.1",
]

[project.scripts]
codeexpert = "codeexpert.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codeexpert"]

# ── Lint and format ───────────────────────────────────────────────────────────
# One tool for both, so "style" is never a review topic. `scripts/check.sh`
# runs `ruff format --check` before `ruff check`; `scripts/fix.sh` applies both.

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "PTH",  # prefer pathlib over os.path
    "S",    # flake8-bandit — this project compiles and runs untrusted code
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use fake credentials and reach into privates on purpose.
"tests/*" = [
    "S101",    # assert is the point
    "S105",    # fake credentials in fixtures
    "S106",
    "SLF001",  # reaching into a fake's internals is fine
    "S314",    # parsing XML this repository just produced
]

# ── Tests ─────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "requires_gcc: needs a C compiler on PATH (skipped automatically when absent)",
    "integration: exercises several modules together; still offline and deterministic",
]

[tool.coverage.run]
source = ["src/codeexpert"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
